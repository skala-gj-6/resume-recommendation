spring:
  datasource:
    url: jdbc:h2:mem:resume_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  company-seed:
    enabled: true
    companies: classpath:company_seed.json
    company-infos: classpath:company_info_seed.json
