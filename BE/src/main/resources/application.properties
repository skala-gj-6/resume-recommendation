spring.application.name=be

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resume_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:resume_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.recruitment-provider.base-url=${RECRUITMENT_PROVIDER_BASE_URL:http://localhost:8000}
app.company-seed.enabled=${COMPANY_SEED_ENABLED:true}
app.company-seed.companies=classpath:company_seed.json
app.company-seed.company-infos=classpath:company_info_seed.json
