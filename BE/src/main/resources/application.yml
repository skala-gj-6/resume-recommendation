spring:
  application:
    name: be
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resume_service}"
    username: "${SPRING_DATASOURCE_USERNAME:resume_user}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: "${SPRING_JPA_HIBERNATE_DDL_AUTO:update}"
    open-in-view: false

server:
  port: "${SERVER_PORT:8080}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  recruitment-provider:
    base-url: "${RECRUITMENT_PROVIDER_BASE_URL:http://localhost:8000}"
  company-seed:
    enabled: "${COMPANY_SEED_ENABLED:true}"
    companies: classpath:company_seed.json
    company-infos: classpath:company_info_seed.json
  recommendation:
    provider: "${RECOMMENDATION_PROVIDER:mock}"
    result-limit: "${RECOMMENDATION_RESULT_LIMIT:10}"
  ai:
    draft-executor:
      core-size: "${DRAFT_EXECUTOR_CORE_SIZE:2}"
      max-size: "${DRAFT_EXECUTOR_MAX_SIZE:4}"
      queue-capacity: "${DRAFT_EXECUTOR_QUEUE_CAPACITY:20}"
