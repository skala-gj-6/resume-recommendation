services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_service}
      POSTGRES_USER: ${POSTGRES_USER:-resume_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mock-api:
    build:
      context: ./MOCK
    ports:
      - "127.0.0.1:${MOCK_API_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: ${MOCK_API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./BE
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-resume_service}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-resume_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-resume_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      RECRUITMENT_PROVIDER_BASE_URL: http://mock-api:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-45s}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8000}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-2}
      LLM_DEFAULT_TARGET_CHARS: ${LLM_DEFAULT_TARGET_CHARS:-700}
      LLM_TARGET_RATIO: ${LLM_TARGET_RATIO:-0.9}
      LLM_MINIMUM_RATIO: ${LLM_MINIMUM_RATIO:-0.7}
      LLM_EXPERIENCE_PROMPT_LOCATION: ${LLM_EXPERIENCE_PROMPT_LOCATION:-classpath:prompts/experience-structure.st}
      LLM_COVER_LETTER_PROMPT_LOCATION: ${LLM_COVER_LETTER_PROMPT_LOCATION:-classpath:prompts/cover-letter-generation.st}
      LLM_EXPERIENCE_SCHEMA_LOCATION: ${LLM_EXPERIENCE_SCHEMA_LOCATION:-classpath:schemas/experience-structure.json}
      LLM_COVER_LETTER_SCHEMA_LOCATION: ${LLM_COVER_LETTER_SCHEMA_LOCATION:-classpath:schemas/cover-letter-generation.json}
      DRAFT_PENDING_STALE_AFTER: ${DRAFT_PENDING_STALE_AFTER:-30m}
      DRAFT_GENERATING_STALE_AFTER: ${DRAFT_GENERATING_STALE_AFTER:-3m}
      DRAFT_RECOVERY_SCAN_INTERVAL: ${DRAFT_RECOVERY_SCAN_INTERVAL:-1m}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      mock-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./FE
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://backend:8080
      VITE_MOCK_API_BASE_URL: http://localhost:${MOCK_API_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
      mock-api:
        condition: service_healthy

volumes:
  postgres-data:
